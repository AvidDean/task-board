name: CI/CD Pipeline

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------
  # 1. RUN THE TESTS (with XML Artifact & Visual Job Summary)
  # ---------------------------------------------------------------
  test:
    name: Test the backend
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install packages
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        id: pytest
        working-directory: backend
        shell: bash
        run: pytest -v --junitxml=test-results.xml 2>&1 | tee pytest-output.txt

      - name: Write the test summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend Test Report"
            echo ""
            echo "| Item | Outcome |"
            echo "| :--- | :--- |"
            echo "| **Status** | \`${{ steps.pytest.outcome }}\` |"
            echo "| **Commit** | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "<details><summary>Console Test Output</summary>"
            echo ""
            echo '```text'
            tail -n 25 pytest-output.txt
            echo '```'
            echo "</details>"
          } >> "\$GITHUB_STEP_SUMMARY"

      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. BUILD BACKEND IMAGE, SCAN WITH TRIVY, PUSH TO GHCR
  # ---------------------------------------------------------------
  build-scan-push:
    name: Build and scan (backend)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/\\({GITHUB_REPOSITORY,,}-backend" >> "\\)GITHUB_ENV"

      - name: Build the image
        run: |
          docker build \
            --tag "\\({IMAGE}:\\){GITHUB_SHA}" \
            --tag "\${IMAGE}:latest" \
            backend

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: \\({{ env.IMAGE }}:\\){{ github.sha }}
          format: table
          output: trivy-backend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Write the scan summary
        if: always()
        run: |
          {
            echo "## Trivy Vulnerability Scan: Backend"
            echo ""
            echo '```text'
            head -n 60 trivy-backend.txt 2>/dev/null || echo "No findings or report generated."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-backend
          path: trivy-backend.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push'
        run: docker push --all-tags "${IMAGE}"

  # ---------------------------------------------------------------
  # 3. DEPLOY BACKEND TO EC2 (Staging or Production)
  # ---------------------------------------------------------------
  deploy-backend:
    name: Deploy backend to EC2
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-backend-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Copy the compose file to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ vars.APP_DIR }}

      - name: Start the new version on the server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ vars.APP_DIR }}
          APP_PORT: ${{ vars.APP_PORT }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_BASE,IMAGE_TAG,APP_DIR,APP_PORT,FRONTEND_ORIGIN,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_BASE IMAGE_TAG APP_PORT FRONTEND_ORIGIN
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:${APP_PORT}/api/health"; then
                echo
                echo "The backend is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "The backend did not become healthy. Last logs:"
            docker compose logs --tail 50
            exit 1

      - name: Check the API from outside
        if: github.ref_name == 'main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: curl -fsS "http://${EC2_HOST}:${APP_PORT}/api/health"

  # ---------------------------------------------------------------
  # 4. DEPLOY FRONTEND TO S3 (Syncs After Backend Is Live)
  # ---------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend to S3
    needs: deploy-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-frontend-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write config.js with this environment's backend address
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "The API_URL variable is empty on this environment."
            exit 1
          fi
          echo "window.API_BASE = \"${API_URL}\";" > frontend/config.js

      - name: Refuse to deploy a page that still points at localhost
        run: |
          if grep -qiE "localhost|127\.0\.0\.1" frontend/config.js; then
            echo "config.js still contains localhost. Check the API_URL variable on this environment."
            exit 1
          fi

      - name: Upload the site to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: aws s3 sync frontend/ "s3://${FRONTEND_BUCKET}/" --delete --exclude "config.local.js"
